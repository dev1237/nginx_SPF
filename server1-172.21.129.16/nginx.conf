# =============================================================================
#  /etc/nginx/nginx.conf   --  SSH TCP load balancer  (RHEL 8.8)
#  Runs on 172.21.129.16 (this host); balances SSH across local 127.0.0.1:2222
#  (max 5 connections) and overflow to 172.21.129.138:22
# =============================================================================

# --- stream module ---------------------------------------------------------
# Keep EXACTLY ONE of the two lines below. Decide with:
#     nginx -V 2>&1 | tr ' ' '\n' | grep -- --with-stream
#     ls /usr/share/nginx/modules/ /usr/lib64/nginx/modules/
#   * "--with-stream" without "=dynamic"  -> built in, comment out BOTH lines
#   * mod-stream.conf exists (dnf install nginx-mod-stream) -> prefer the include
# Never load the module twice: "module ... is already loaded" is a fatal error.
load_module /usr/lib64/nginx/modules/ngx_stream_module.so;
#include /usr/share/nginx/modules/*.conf;

user  nginx;

# max_conns is enforced per worker unless the upstream has a shared "zone"
# (see stream.conf.d/ssh-lb.conf). The zone is what keeps "auto" safe here.
worker_processes auto;

error_log /var/log/nginx/error.log notice;

pid /run/nginx.pid;

events {
    worker_connections 1024;
}

# No http {} block: this box only proxies TCP. Add one back (plus
# "include /etc/nginx/conf.d/*.conf;") if you ever want nginx to serve HTTP.

stream {
    # custom log format for stream (TCP/UDP) connections
    log_format stream_log '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          'upstream_addr=$upstream_addr '
                          'session_time=$session_time';

    # NOTE: a stream session is logged when it CLOSES, not when it opens.
    access_log /var/log/nginx/stream_access.log stream_log;

    # Stream configs cannot live in /etc/nginx/conf.d/ -- that directory is
    # included inside http {}. This is the stream equivalent.
    include /etc/nginx/stream.conf.d/*.conf;
}
