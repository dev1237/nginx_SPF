! /etc/keepalived/keepalived.conf -- 172.21.129.16 (preferred MASTER)
! Provides HA for the SSH load-balancer role: whichever node holds
! 172.21.129.200 is the one nginx actually serves SSH traffic on.

global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2      ! check every 2s
    fall 2           ! 2 consecutive failures -> considered down
    rise 2           ! 2 consecutive successes -> considered back up
    weight -60       ! subtract from priority on failure (150-60=90 < peer's 100)
}

vrrp_instance SSH_LB {
    state MASTER
    interface eno1
    virtual_router_id 51
    priority 150
    advert_int 1
    preempt

    authentication {
        auth_type PASS
        auth_pass sshlb26
    }

    virtual_ipaddress {
        172.21.129.200/20 dev eno1
    }

    track_script {
        chk_nginx
    }
}
