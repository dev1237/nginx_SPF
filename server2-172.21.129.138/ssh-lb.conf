# =============================================================================
#  /etc/nginx/stream.conf.d/ssh-lb.conf
#  Included from inside the stream {} block of /etc/nginx/nginx.conf, so this
#  file must NOT wrap itself in "stream { }" and must NOT repeat load_module.
#
#  IDENTICAL on both LB nodes (172.21.129.16 and 172.21.129.138). Which
#  physical node this process happens to run on is irrelevant to the LB
#  policy below -- 172.21.129.16 is always primary (max 5 conns), .138 is
#  always overflow. HA/failover (which node currently owns the VIP and thus
#  actually receives traffic) is handled separately by keepalived/VRRP.
# =============================================================================

upstream ssh_pool {
    # Shared memory zone: without it max_conns counts per worker process,
    # so "5" would really mean 5 x number-of-workers before overflow.
    zone ssh_pool 64k;

    # Primary -- always 172.21.129.16, regardless of which node nginx is
    # running on. Real IP:22 now (no more loopback:2222 trick) so it's
    # reachable over the network by the OTHER node's nginx during failover.
    server 172.21.129.16:22 max_conns=5 max_fails=3 fail_timeout=30s;

    # Overflow -- taken only when the primary is at 5 live sessions or is down.
    # "backup" (not plain round-robin) is what produces fill-then-spill.
    server 172.21.129.138:22 backup max_fails=3 fail_timeout=30s;
}

server {
    # Bind ONLY the floating VIP, not 0.0.0.0. This is what lets both nodes'
    # real sshd keep using their own real IP:22 normally, and is what makes
    # keepalived-driven failover work: only the node currently holding the
    # VIP can actually accept connections here.
    listen 172.21.129.200:22 so_keepalive=on;
    proxy_pass ssh_pool;

    proxy_connect_timeout 5s;

    # Idle timeout for an established SSH session.
    proxy_timeout 1h;
}
